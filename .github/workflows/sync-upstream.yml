# Keeps this fork in step with thingsboard/thingsboard.
# Branches move only by fast-forward (or a merge into the default branch, which carries this file),
# existing tags are never moved, and a branch holding commits upstream doesn't have is left alone.
# Pushes that touch upstream's workflow files need a token with the `workflow` scope: add a
# fine-grained PAT for this repo (Contents: read/write, Workflows: read/write, Pull requests: read/write)
# as the SYNC_TOKEN secret. Without it, github.token is used and such pushes are rejected.
name: Sync upstream

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Keep upstream's own workflows disabled in the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list -R "$GITHUB_REPOSITORY" --json id,path \
            -q '.[] | select(.path != ".github/workflows/sync-upstream.yml") | .id' \
            | xargs -r -n1 gh workflow disable -R "$GITHUB_REPOSITORY"

      - name: Sync branches and tags
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          UPSTREAM: https://github.com/thingsboard/thingsboard.git
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          git init -q fork && cd fork
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream "$UPSTREAM"
          git fetch -q --filter=blob:none --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q --filter=blob:none --no-tags upstream '+refs/heads/*:refs/remotes/upstream/*'

          failed=0
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          push() { git push -q origin "$1" || { summary "- push failed: \`$1\`"; failed=1; return 1; }; }

          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/upstream); do
            up=$(git rev-parse "refs/remotes/upstream/$ref")
            if ! mine=$(git rev-parse -q --verify "refs/remotes/origin/$ref"); then
              push "$up:refs/heads/$ref" && summary "- new: \`$ref\`"
            elif [ "$mine" = "$up" ] || git merge-base --is-ancestor "$up" "$mine"; then
              :
            elif git merge-base --is-ancestor "$mine" "$up"; then
              push "$up:refs/heads/$ref" && summary "- fast-forward: \`$ref\` ($(git rev-list --count "$mine..$up") commits)"
            elif [ "$ref" = "$DEFAULT_BRANCH" ]; then
              git checkout -q -B "$ref" "$mine"
              if git merge -q --no-edit -m "Merge upstream $ref" "$up"; then
                push "HEAD:refs/heads/$ref" && summary "- merged upstream into \`$ref\`"
              else
                git merge --abort
                push "+$up:refs/heads/upstream-sync/$ref" || continue
                gh pr list -R "$GITHUB_REPOSITORY" --head "upstream-sync/$ref" --json number -q '.[0].number' | grep -q . \
                  || gh pr create -R "$GITHUB_REPOSITORY" --base "$ref" --head "upstream-sync/$ref" \
                       --title "Merge upstream $ref (conflicts)" --body "Upstream \`$ref\` no longer merges cleanly into the fork. Resolve the conflicts here."
                summary "- conflict on \`$ref\`: PR from \`upstream-sync/$ref\`"
                failed=1
              fi
            else
              summary "- skipped \`$ref\`: it has commits upstream doesn't (fork changes or an upstream rewrite)"
            fi
          done

          comm -23 \
            <(git ls-remote --tags --refs upstream | awk '{print $2}' | sort) \
            <(git ls-remote --tags --refs origin | awk '{print $2}' | sort) > new-tags
          if [ -s new-tags ]; then
            git fetch -q --filter=blob:none --no-tags upstream $(sed 's#.*#&:&#' new-tags)
            while read -r tag; do push "$tag:$tag" && summary "- new tag: \`${tag#refs/tags/}\`"; done < new-tags
          fi

          exit $failed
